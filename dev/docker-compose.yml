# Dev compose — builds the image LOCALLY from the repo's Dockerfile and
# runs it with a throwaway data dir. For testing the container itself;
# the faster inner loop for engine work is plain `cargo run -p nzbd`.
#
#   cd dev
#   docker compose up --build         # build + run (foreground, logs)
#   # nzbd-init sets config/data ownership to 1000:1000 before nzbd starts.
#   # → http://localhost:6789/ serves the first-run setup UI, which
#   #   writes config/nzbd.toml and restarts the daemon with it.
#   # (Or pre-seed: cp nzbd.toml.example config/nzbd.toml)
#
# Rebuild-on-change (Compose v2.22+): `docker compose watch` rebuilds the
# image whenever crate sources or the Dockerfile change.

# All services run the same locally built image. Keep the build attached to
# each service: Compose resolves images before applying `depends_on`, so an
# image-only discovery service would try to pull the private-looking `nzbd:dev`
# tag while the main service was still building it.
x-nzbd-build: &nzbd-build
  context: ..                    # repo root (the Dockerfile lives there)
  dockerfile: Dockerfile
  args:
    # The context excludes .git, so the image is told its commit here.
    # Unset → the daemon honestly reports `<version>+unknown`.
    # `make docker` fills this in; by hand:
    #   NZBD_GIT_DESCRIBE="$(git describe --tags --always --dirty)" \
    #     docker compose up --build
    NZBD_GIT_DESCRIBE: ${NZBD_GIT_DESCRIBE:-}

services:
  nzbd:
    build: *nzbd-build
    image: nzbd:dev
    container_name: nzbd-dev
    depends_on:
      nzbd-init:
        condition: service_completed_successfully
    ports:
      - "6789:6789"
    volumes: &nzbd-volumes
      - ./data:/data             # throwaway downloads/state, easy to inspect
      # Config DIRECTORY (created and owned by nzbd-init). Start empty and
      # the first-run setup UI at http://localhost:6789/ writes
      # config/nzbd.toml for you — or pre-seed it from nzbd.toml.example.
      - ./config:/etc/nzbd
    environment:
      - TZ=Etc/UTC
      - RUST_LOG=debug           # dev default; drop to info if too chatty
    healthcheck:
      test: ["CMD", "nzbd", "status", "--url", "127.0.0.1:6789"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    develop:
      watch:
        - action: rebuild
          path: ../crates
        - action: rebuild
          path: ../Cargo.toml
        - action: rebuild
          path: ../Cargo.lock
        - action: rebuild
          path: ../Dockerfile

  nzbd-init:
    build: *nzbd-build
    image: nzbd:dev
    user: "0:0"
    restart: "no"
    volumes: *nzbd-volumes
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown -h 1000:1000 /etc/nzbd /data
        if [ -f /etc/nzbd/nzbd.toml ] && [ ! -L /etc/nzbd/nzbd.toml ]; then
          chown -h 1000:1000 /etc/nzbd/nzbd.toml
        fi

  nzbd-discovery:
    build: *nzbd-build
    image: nzbd:dev
    container_name: nzbd-discovery-dev
    network_mode: host
    command: ["advertise", "--name", "${NZBD_DISCOVERY_NAME:-nzbd-dev}", "--port", "6789"]
    depends_on:
      nzbd:
        condition: service_healthy
