version: 2
updates:
  # fuzz/Cargo.lock is derived from Cargo.lock and Dependabot does not manage
  # it. The required supply-chain check fails until the PR also carries the
  # regenerated fuzz lock: check out the PR branch, run `make fuzz-lock`, and
  # push the result (Dependabot stops rebasing a PR once others commit to it).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mobile-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      deployment-image-patches:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
