name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fairness-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - run: cargo test --locked -p nzbd-cluster --test cluster_fairness -- --nocapture
