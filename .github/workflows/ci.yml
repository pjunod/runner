name: Tests

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # External-tool tests (par2, 7z) self-skip on machines without the
  # binaries; in CI a missing tool must be a failure, never a skip.
  NZBD_REQUIRE_TOOLS: 1

jobs:
  mobile:
    name: mobile quality + release guard
    # The signing guard configures the Android Gradle project and depends on
    # the hosted image's preinstalled Android SDK.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: release signing fails closed without an upload key
        working-directory: mobile/android
        run: |
          if ./gradlew :app:validateNzbdReleaseSigning \
              --configuration-cache --configuration-cache-problems=warn \
              > "$RUNNER_TEMP/release-signing.log" 2>&1; then
            cat "$RUNNER_TEMP/release-signing.log"
            echo "release build unexpectedly accepted missing signing credentials"
            exit 1
          fi
          grep -F "Android release signing is not configured" "$RUNNER_TEMP/release-signing.log"
      - name: release signing accepts and attaches an external upload key
        working-directory: mobile/android
        env:
          NZBD_ANDROID_STORE_FILE: ${{ runner.temp }}/nzbd-upload-key.p12
          NZBD_ANDROID_STORE_PASSWORD: ci-test-password
          NZBD_ANDROID_KEY_ALIAS: nzbd-upload
          NZBD_ANDROID_KEY_PASSWORD: ci-test-password
        run: |
          keytool -genkeypair -storetype PKCS12 \
            -noprompt \
            -keystore "$NZBD_ANDROID_STORE_FILE" \
            -storepass "$NZBD_ANDROID_STORE_PASSWORD" \
            -keypass "$NZBD_ANDROID_KEY_PASSWORD" \
            -alias "$NZBD_ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=nzbd CI, OU=CI, O=nzbd, L=Test, ST=Test, C=US"
          ./gradlew :app:validateNzbdReleaseSigning \
            --configuration-cache --configuration-cache-problems=warn
          ./gradlew :app:validateNzbdReleaseSigning \
            --configuration-cache --configuration-cache-problems=warn \
            | tee "$RUNNER_TEMP/release-signing-cache.log"
          grep -F "Reusing configuration cache." "$RUNNER_TEMP/release-signing-cache.log"
          ./gradlew :app:validateSigningRelease
          ./gradlew :app:assembleRelease --dry-run

  test:
    name: unit + e2e
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'github' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install PP tools (par2, 7z)
        if: vars.CI_RUNNER_MODE == 'github' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
        run: sudo apt-get update && sudo apt-get install -y par2 p7zip-full
      - name: verify self-hosted PP tools
        if: vars.CI_RUNNER_MODE != 'github' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
        run: command -v par2 && command -v 7z
      # The whole pyramid: parser/codec/ladder unit tests, engine e2e
      # against the mock NNTP server (incl. kill-and-resume), multi-node
      # cluster tests (election, failover, reclaim), and the whole-daemon
      # CLI/compat test that boots the real binary.
      - name: cargo test
        run: cargo test --locked --workspace

  msrv:
    name: MSRV check (1.95)
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'github' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on the minimum supported Rust version
        run: cargo check --workspace --all-targets
