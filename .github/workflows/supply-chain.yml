name: Supply chain

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    # Refresh the RustSec result even when the lockfile has not changed.
    - cron: "17 6 * * *"
  workflow_dispatch:

# Each job below is a required check. None may skip on a draft (GitHub counts
# a skipped required check as passing); each fails through
# scripts/ci-merge-candidate instead, which reads the live PR state.
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  reviewed-exceptions:
    name: reviewed dependency exceptions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a merge candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci-merge-candidate
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: reviewed-dependency-exceptions
      - name: Freeze reviewed package, feature, license, and advisory sets
        run: scripts/check-reviewed-dependency-exceptions.sh
      - name: Keep the BitTorrent release review aligned with the no-go gates
        run: scripts/check-bittorrent-release-review.sh
      # fuzz/Cargo.lock is derived from Cargo.lock, and the fuzz campaigns only
      # run on main. Check the derived lock here so a product lock change that
      # was not carried into it (fix: make fuzz-lock) fails before merge.
      - name: Keep the isolated fuzz lock on the reviewed product lock
        run: make fuzz-deps

  policy:
    name: licenses, bans, and sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a merge candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci-merge-candidate
      # cargo-deny-action v2.1.1, cargo-deny 0.20.2. Pin the immutable
      # revision so the supply-chain gate cannot change underneath a run.
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # 3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.95"
          command: check bans licenses sources
          arguments: --all-features --locked

  advisories:
    name: RustSec advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a merge candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci-merge-candidate
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-audit@0.22.0
      - name: Restore vendored crates to registry provenance
        run: scripts/vendor-audit-lock --output target/vendor-audit/Cargo.lock
      - name: Audit workspace and vendored release identities
        run: cargo audit --file target/vendor-audit/Cargo.lock
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # 3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.95"
          command: check advisories
          arguments: --all-features --locked
