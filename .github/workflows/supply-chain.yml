name: Supply chain

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    # Refresh the RustSec result even when the lockfile has not changed.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  reviewed-exceptions:
    name: reviewed dependency exceptions
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: reviewed-dependency-exceptions
      - name: Freeze reviewed package, feature, license, and advisory sets
        run: scripts/check-reviewed-dependency-exceptions.sh
      - name: Keep the BitTorrent release review aligned with the no-go gates
        run: scripts/check-bittorrent-release-review.sh

  policy:
    name: licenses, bans, and sources
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # cargo-deny-action v2.1.1, cargo-deny 0.20.2. Pin the immutable
      # revision so the supply-chain gate cannot change underneath a run.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # 3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.95"
          command: check bans licenses sources
          arguments: --all-features --locked

  advisories:
    name: RustSec advisories
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit@0.22.0
      - name: Restore vendored crates to registry provenance
        run: scripts/vendor-audit-lock --output target/vendor-audit/Cargo.lock
      - name: Audit workspace and vendored release identities
        # The repository exception contract freezes these exact identifiers,
        # dependency paths, and feature sets before this job. cargo-audit does
        # not read deny.toml, so keep its invocation aligned explicitly.
        run: >-
          cargo audit --file target/vendor-audit/Cargo.lock
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # 3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.95"
          command: check advisories
          arguments: --all-features --locked
