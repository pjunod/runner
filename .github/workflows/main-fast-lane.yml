name: Main fast lane

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

env:
  CARGO_TERM_COLOR: always
  NZBD_REQUIRE_TOOLS: 1

concurrency:
  group: main-fast-lane-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Select affected validation
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      mobile: ${{ steps.scope.outputs.mobile }}
      torrent: ${{ steps.scope.outputs.torrent }}
      docs: ${{ steps.scope.outputs.docs }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci-scope "$VALIDATION_BASE" >> "$GITHUB_OUTPUT"

  preflight:
    name: Static contracts
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: scripts/check-fast-lane-contract
      - name: Exercise the embedded application JavaScript
        run: make ui-test

  rust:
    name: Rust merge candidate
    needs: [scope, preflight]
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    # Cold native-code dependency builds plus every selected regression lane
    # exceeded 20 minutes while tests were still completing (PR #301).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install bounded post-processing dependencies
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y par2 p7zip-full
      - name: Verify self-hosted post-processing dependencies
        if: runner.environment == 'self-hosted'
        run: command -v par2 && command -v 7z
      - id: rust_checks
        run: make fast-check-rust
      - name: Torrent transfer and recovery regressions
        if: ${{ !cancelled() && (steps.rust_checks.outcome == 'success' || steps.rust_checks.outcome == 'failure') && needs.scope.outputs.torrent == 'true' }}
        run: make fast-check-torrent
      - name: Documentation contract tests
        if: ${{ !cancelled() && (steps.rust_checks.outcome == 'success' || steps.rust_checks.outcome == 'failure') }}
        run: make fast-check-docs
      - name: Startup recovery and enrollment regressions
        if: ${{ !cancelled() && (steps.rust_checks.outcome == 'success' || steps.rust_checks.outcome == 'failure') }}
        run: make fast-check-startup

  mobile:
    name: Mobile compile and unit lane
    needs: [scope, preflight]
    if: needs.scope.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  gate:
    name: Main promotion gate
    if: always() && github.event.pull_request.draft == false
    needs: [scope, preflight, rust, mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every selected lane
        env:
          SCOPE: ${{ needs.scope.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
          RUST: ${{ needs.rust.result }}
          MOBILE: ${{ needs.mobile.result }}
        run: |
          for result in "$SCOPE" "$PREFLIGHT" "$RUST" "$MOBILE"; do
            case "$result" in
              success) ;;
              *) echo "Selected lane ended with: $result"; exit 1 ;;
            esac
          done
