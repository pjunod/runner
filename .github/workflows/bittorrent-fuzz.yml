name: BitTorrent fuzz

on:
  push:
    branches: [main]
    paths:
      - Makefile
      - Cargo.lock
      - crates/nzbd-torrent/**
      - vendor/cryptr/**
      - contrib/cryptr/**
      - contrib/rqbit/**
      - scripts/bincode-compatibility/**
      - fuzz/**
      - scripts/check-bittorrent-fuzz-deps.sh
      - .github/workflows/bittorrent-fuzz.yml
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  metainfo-preflight:
    name: input preflight (libFuzzer)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-08-01
          components: rustfmt
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz -> target

      - name: Check fuzz harness formatting
        run: cargo +nightly-2026-08-01 fmt --manifest-path fuzz/Cargo.toml -- --check

      - name: Verify reviewed fuzz seeds and dependencies
        run: make fuzz-test

      - name: Run bounded pull-request fuzzing
        if: github.event_name != 'schedule'
        run: make fuzz-metainfo-run FUZZ_TARGET=x86_64-unknown-linux-gnu

      - name: Run bounded pull-request magnet fuzzing
        if: github.event_name != 'schedule'
        run: make fuzz-magnet-run FUZZ_TARGET=x86_64-unknown-linux-gnu

      - name: Run scheduled five-minute fuzzing
        if: github.event_name == 'schedule'
        run: >-
          make fuzz-metainfo-run
          FUZZ_TARGET=x86_64-unknown-linux-gnu
          FUZZ_SECONDS=300

      - name: Run scheduled five-minute magnet fuzzing
        if: github.event_name == 'schedule'
        run: >-
          make fuzz-magnet-run
          FUZZ_TARGET=x86_64-unknown-linux-gnu
          FUZZ_SECONDS=300

      - name: Run bounded peer and key-bundle fuzzing
        run: >-
          make fuzz-codecs-run
          FUZZ_TARGET=x86_64-unknown-linux-gnu
          FUZZ_SECONDS=${{ github.event_name == 'schedule' && '300' || '60' }}

      - name: Upload reproducer on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: input-preflight-reproducers
          path: |
            fuzz/artifacts/metainfo_preflight/
            fuzz/artifacts/magnet_preflight/
            fuzz/artifacts/peer_protocol/
            fuzz/artifacts/key_bundle/
          if-no-files-found: ignore
