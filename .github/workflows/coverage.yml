name: Coverage

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Raise only after a complete main-branch run proves the new floor.
  # Measured on main: 90.63% (84aa333) and 90.62% (59d5deb). 90.0 leaves
  # ~0.6 points -- about 170 of 27,404 instrumented lines -- against a
  # per-commit spread of at most 0.05 points since the suite was stabilized.
  MINIMUM_LINE_COVERAGE: 90.0
  # External-tool tests (par2, 7z) self-skip on machines without the
  # binaries; in CI a missing tool must be a failure, never a skip.
  NZBD_REQUIRE_TOOLS: 1

permissions:
  contents: write # force-push the badges branch (main pushes only)

jobs:
  coverage:
    name: cargo llvm-cov
    # Keep the badge-branch write token on a disposable GitHub runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-llvm-cov
      - name: install PP tools (par2, 7z)
        run: sudo apt-get update && sudo apt-get install -y par2 p7zip-full

      - name: run instrumented test suite
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --no-fail-fast --lcov --output-path lcov.info 2>&1 | tee cov-run.out
          TESTS=$(grep -oE 'test result: ok\. [0-9]+ passed' cov-run.out | grep -oE '[0-9]+' | awk '{s+=$1} END {print s}')
          COVERAGE=$(cargo llvm-cov report --json --summary-only \
            | python3 -c "import json,sys; print(round(json.load(sys.stdin)['data'][0]['totals']['lines']['percent'], 1))")
          echo "TESTS=$TESTS" >> "$GITHUB_ENV"
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_ENV"
          echo "### Coverage: ${COVERAGE}% lines · ${TESTS} tests passed" >> "$GITHUB_STEP_SUMMARY"

      - name: enforce minimum line coverage
        run: |
          cargo llvm-cov report --summary-only \
            --fail-under-lines "$MINIMUM_LINE_COVERAGE"

      - name: HTML report
        run: cargo llvm-cov report --html

      - name: generate badges
        if: success()
        run: python3 scripts/coverage-badges.py --coverage "$COVERAGE" --tests "$TESTS" --out badges-out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            lcov.info
            target/llvm-cov/html/
          if-no-files-found: error
          # This step has no `if:`, so it uploads about 1.07 MB on every push
          # and every pull-request run — a mean of twelve runs a day, and 53 on
          # the busiest. At the 90-day default that is a steady state of
          # roughly 1.16 GB from this one step, which is more than the account's
          # entire shared Actions-storage allowance. It is why uploads across
          # the account began being refused with `Artifact storage quota has
          # been hit`.
          #
          # A week is the useful life of this artifact. `lcov.info` is
          # regenerable from any commit by re-running the job, and the browsable
          # HTML tree — 87% of the bytes — is only ever opened while someone is
          # looking at that particular run. Seven days holds ~90 MB.
          retention-days: 7

      # Self-hosted badges: single-commit `badges` branch, force-updated on
      # every main push; README references the raw files.
      - name: publish badges branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd badges-out
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "badges for ${GITHUB_SHA} (${COVERAGE}% lines, ${TESTS} tests)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges
