name: BitTorrent M0

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - contrib/rqbit/maintained-series.txt
      - contrib/rqbit/*.sha256
      - contrib/rqbit/vendor/**
      - crates/nzbd-state/**
      - crates/nzbd-torrent/**
      - crates/nzbd/src/main.rs
      - crates/nzbd/src/tls.rs
      - scripts/check-bittorrent-deps.sh
      - scripts/check-private-discovery-leaks.sh
      - scripts/check-bittorrent-storage-full-probe.sh
      - scripts/check-rqbit-maintained-patch-series.sh
      - .github/workflows/bittorrent-m0.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-policy:
    name: exact engine + Rust TLS only
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'github' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
        with:
          key: bittorrent-m0-dependency-policy
      - name: Check the pinned engine and TLS graph
        run: scripts/check-bittorrent-deps.sh

  private-discovery-capture:
    name: private torrent DHT/LSD packet capture
    # This proof installs packet-capture tooling and manipulates host firewall
    # state, so it stays on a disposable GitHub runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
        with:
          key: bittorrent-m0-private-discovery-capture
      - name: Install packet-capture tools
        run: sudo apt-get update && sudo apt-get install -y iptables tcpdump
      - name: Prove private discovery does not enter DHT or LSD
        run: scripts/check-private-discovery-leaks.sh

  native:
    name: ${{ matrix.name }} (Rust 1.85)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-gnu
            runner: ${{ (vars.CI_RUNNER_MODE == 'github' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general"]' }}
            target: x86_64-unknown-linux-gnu
          - name: macos-aarch64
            runner: ${{ (vars.CI_RUNNER_MODE == 'github' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["macos-latest"]' || '["self-hosted","macOS","ARM64","lab","apple","xcode-27.2"]' }}
            target: aarch64-apple-darwin
          - name: windows-x86_64-msvc
            runner: '["windows-latest"]'
            target: x86_64-pc-windows-msvc
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Verify Xcode 27.2
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          xcodebuild -version | awk '{ print } NR == 1 { valid = ($0 == "Xcode 27.2") } END { exit !valid }'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: bittorrent-m0-${{ matrix.target }}
      - name: Run the isolated adapter suite
        run: cargo test --locked -p nzbd-torrent --target ${{ matrix.target }}
      - name: Verify pending-source Windows ACL
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked -p nzbd-state --target ${{ matrix.target }}
      - name: Bound sampled 100-torrent resident-memory growth
        run: >-
          cargo run --locked -p nzbd-torrent --release
          --target ${{ matrix.target }} --example m0_session_pressure_memory
      - name: Bound sampled 100,000-file preflight resident-memory growth
        run: >-
          cargo run --locked -p nzbd-torrent --release --features fuzzing
          --target ${{ matrix.target }} --example m0_metainfo_pressure_memory
      - name: Inject write and sizing storage-full faults
        shell: bash
        run: scripts/check-bittorrent-storage-full-probe.sh "${{ matrix.target }}"
      - name: Record host filesystem name behavior
        run: >-
          cargo test --locked -p nzbd-torrent --target ${{ matrix.target }}
          --test filesystem_probe -- --nocapture

  musl:
    name: ${{ matrix.name }} (Rust 1.85)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-musl
            runner: ${{ (vars.CI_RUNNER_MODE == 'github' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","lab","general"]' }}
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64-musl
            runner: '["ubuntu-24.04-arm"]'
            target: aarch64-unknown-linux-musl
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: vars.CI_RUNNER_MODE == 'github' || matrix.target == 'aarch64-unknown-linux-musl' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Verify self-hosted musl toolchain
        if: vars.CI_RUNNER_MODE != 'github' && matrix.target == 'x86_64-unknown-linux-musl' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
        run: command -v musl-gcc
      - uses: Swatinem/rust-cache@v2
        with:
          key: bittorrent-m0-${{ matrix.target }}
      - name: Run the isolated adapter suite
        run: cargo test --locked -p nzbd-torrent --target ${{ matrix.target }}
      - name: Bound sampled 100-torrent resident-memory growth
        run: >-
          cargo run --locked -p nzbd-torrent --release
          --target ${{ matrix.target }} --example m0_session_pressure_memory
      - name: Bound sampled 100,000-file preflight resident-memory growth
        run: >-
          cargo run --locked -p nzbd-torrent --release --features fuzzing
          --target ${{ matrix.target }} --example m0_metainfo_pressure_memory
      - name: Inject write and sizing storage-full faults
        shell: bash
        run: scripts/check-bittorrent-storage-full-probe.sh "${{ matrix.target }}"
