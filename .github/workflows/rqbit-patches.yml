        run: scripts/check-rqbit-session-peer-budget-patch.sh "$RUNNER_TEMP/rqbit"

  pending-handshake-budget:
    name: ${{ matrix.name }} / pending handshake budget
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 backport / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main native boundary"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rqbit-handshake-budget-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Verify the stable backport or current native boundary
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-pending-handshake-budget.sh "$RUNNER_TEMP/rqbit"

  known-peer-budget:
    name: ${{ matrix.name }} / known peer budget
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rqbit-known-peer-budget-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-known-peer-budget-patch.sh "$RUNNER_TEMP/rqbit"

  peer-response-budget:
    name: ${{ matrix.name }} / peer response budget
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rqbit-peer-response-budget-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-peer-response-budget-patch.sh "$RUNNER_TEMP/rqbit"

  discovery-pressure-budget:
    name: ${{ matrix.name }} / discovery pressure budget
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rqbit-discovery-pressure-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-discovery-pressure-patch.sh "$RUNNER_TEMP/rqbit"
