name: rqbit contribution patches

on:
  schedule:
    # Surface upstream-main drift even when nzbd has not changed.
    - cron: "29 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintained-series:
    name: "blocking: maintained rqbit v8.1.1 series / Rust 1.95"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95"
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rqbit-maintained-v8.1.1-1.95
      - name: Re-derive and test the shipped patch series
        env:
          RQBIT_UPSTREAM_CACHE: ${{ runner.temp }}/rqbit-source-cache/rqbit-v8.1.1.tar.gz
        run: scripts/check-rqbit-maintained-patch-series.sh
      - name: Prove the verified archive cache removes network dependence
        env:
          RQBIT_SERIES_DERIVE_ONLY: "1"
          RQBIT_UPSTREAM_CACHE: ${{ runner.temp }}/rqbit-source-cache/rqbit-v8.1.1.tar.gz
          https_proxy: http://127.0.0.1:1
          no_proxy: ""
        run: scripts/check-rqbit-maintained-patch-series.sh

  authoritative-restore:
    name: ${{ matrix.name }} / authoritative restore
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Stable evidence blocks PRs. Upstream main still runs so drift is visible,
    # but it cannot block a PR when the independently moving branch changes.
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch"
            ref: v8.1.1
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rqbit-${{ matrix.ref }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-authoritative-restore-patch.sh "$RUNNER_TEMP/rqbit"

  discovery-health:
    name: ${{ matrix.name }} / discovery health
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Match the restore job: test current main on PRs without letting upstream
    # drift veto a change whose stable evidence remains reproducible.
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch"
            ref: v8.1.1
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rqbit-${{ matrix.ref }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-discovery-health-patch.sh "$RUNNER_TEMP/rqbit"

  metadata-size-limit:
    name: ${{ matrix.name }} / metadata size limit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rqbit-metadata-size-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-metadata-size-limit-patch.sh "$RUNNER_TEMP/rqbit"

  file-sizing-error:
    name: ${{ matrix.name }} / file sizing error propagation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: 00b97485160ff5b5aa2b379ea0815d568ec665f0
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "blocking: documented rqbit main base"
            ref: 4e5f94cbcf1d57ec500885c77cf1e24d70232d89
            toolchain: stable
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: |
          git clone https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
          git -C "$RUNNER_TEMP/rqbit" checkout --detach "${{ matrix.ref }}"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rqbit-sizing-error-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-file-sizing-error-patch.sh "$RUNNER_TEMP/rqbit"

  tracker-request-budget:
    name: ${{ matrix.name }} / tracker request budget
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rqbit-tracker-budget-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-tracker-request-budget-patch.sh "$RUNNER_TEMP/rqbit"

  session-peer-budget:
    name: ${{ matrix.name }} / session peer budget
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
