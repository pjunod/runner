# nzbd — single-node Docker Compose deployment.
#
#   cd examples/docker-compose
#   docker compose up -d
#
# nzbd-init fixes bind-mount ownership before the unprivileged daemon starts.
# The first-run wizard at http://localhost:6789/ writes config/nzbd.toml.
# To pre-seed instead: mkdir -p config; cp nzbd.toml.example config/nzbd.toml,
# then edit credentials and paths before starting Compose.
#
# Web UI on http://localhost:6789/ — point Sonarr/Radarr at the same
# host/port as an "NZBGet" download client.

services:
  nzbd:
    image: &nzbd-image ghcr.io/pjunod/nzbd:latest
    # …or build from this checkout instead of pulling. The build context
    # excludes .git, so pass the commit in or the daemon reports
    # `<version>+unknown` in its footer and on /api/v1/status — run
    #   NZBD_GIT_DESCRIBE="$(git describe --tags --always --dirty)" \
    #     docker compose up -d --build
    # build:
    #   context: ../..
    #   args:
    #     NZBD_GIT_DESCRIBE: ${NZBD_GIT_DESCRIBE:-}
    container_name: nzbd
    restart: unless-stopped
    depends_on:
      nzbd-init:
        condition: service_completed_successfully
    ports:
      - "6789:6789"
    volumes: &nzbd-volumes
      # Downloads + state. paths.main_dir/dest_dir in nzbd.toml must live
      # under /data for the *arr apps to see the same paths you map here.
      - /data/usenet:/data
      # The config DIRECTORY, read-write — the Settings tab saves here, and
      # an empty config/ lets the first-run wizard create nzbd.toml itself.
      # Mount the directory, never the file: Docker turns a missing
      # bind-mount source file into a directory and the daemon won't start.
      # (A compose `configs:` entry would be read-only, which makes every
      # save in the settings editor fail with EROFS.)
      - ./config:/etc/nzbd
    environment:
      - TZ=Etc/UTC
      # - RUST_LOG=info
    healthcheck:
      # The binary doubles as its own health probe (hits the local API).
      test: ["CMD", "nzbd", "status", "--url", "127.0.0.1:6789"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Docker creates missing bind sources as root. Repair just the two mount
  # roots and the config file; never recursively chown the download tree.
  # Shared mounts keep this helper aligned when you change host paths above.
  nzbd-init:
    image: *nzbd-image
    user: "0:0"
    restart: "no"
    volumes: *nzbd-volumes
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown -h 1000:1000 /etc/nzbd /data
        if [ -f /etc/nzbd/nzbd.toml ] && [ ! -L /etc/nzbd/nzbd.toml ]; then
          chown -h 1000:1000 /etc/nzbd/nzbd.toml
        fi

  # mDNS does not cross a normal Docker bridge. This companion uses the
  # same image but runs only the DNS-SD advertiser on the Linux host network,
  # where phones and tablets can see it. The API remains published by nzbd
  # on host port 6789; no credentials or queue state leave the container.
  nzbd-discovery:
    image: ghcr.io/pjunod/nzbd:latest
    container_name: nzbd-discovery
    restart: unless-stopped
    network_mode: host
    command: ["advertise", "--name", "${NZBD_DISCOVERY_NAME:-nzbd}", "--port", "6789"]
    depends_on:
      nzbd:
        condition: service_healthy

  # Typical companion — uncomment to run Sonarr alongside and add nzbd as
  # its NZBGet download client at host "nzbd", port 6789.
  #
  # sonarr:
  #   image: lscr.io/linuxserver/sonarr:latest
  #   container_name: sonarr
  #   restart: unless-stopped
  #   ports:
  #     - "8989:8989"
  #   volumes:
  #     - ./sonarr-config:/config
  #     - /data/usenet:/data      # same mapping as nzbd = importable paths
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=Etc/UTC
