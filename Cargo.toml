[workspace]
resolver = "2"
members = [
    "crates/nzbd-types",
    "crates/nzbd-nzb",
    "crates/nzbd-yenc",
    "crates/nzbd-par2",
    "crates/nzbd-nntp",
    "crates/nzbd-engine",
    "crates/nzbd-feed",
    "crates/nzbd-post",
    "crates/nzbd-state",
    "crates/nzbd-config",
    "crates/nzbd-api",
    "crates/nzbd-compat",
    "crates/nzbd",
    "crates/nzbd-nserv",
    "crates/nzbd-cluster",
    "crates/nzbd-torrent",
    "crates/nzbd-qbit-compat",
]
exclude = ["contrib/rqbit/vendor", "vendor/hiqlite", "vendor/hiqlite-wal"]

[workspace.package]
# Releases are git tags `v<this>` — see docs/DEPLOY.md, "Cutting a
# release". What the daemon reports comes from `git describe`, so it moves
# on every commit; this is only the release the count is measured from.
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
# License note: this code is written from scratch against a behavioral spec
# (docs/ARCHITECTURE.md §3). If any implementation is ever ported closely from
# nzbget source (GPL-2.0-or-later), the affected crate must switch to GPL.
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/nzbd"

[workspace.dependencies]
nzbd-types = { version = "=0.2.0", path = "crates/nzbd-types" }
nzbd-nzb = { version = "=0.2.0", path = "crates/nzbd-nzb" }
nzbd-yenc = { version = "=0.2.0", path = "crates/nzbd-yenc" }
nzbd-par2 = { version = "=0.2.0", path = "crates/nzbd-par2" }
nzbd-nntp = { version = "=0.2.0", path = "crates/nzbd-nntp" }
nzbd-engine = { version = "=0.2.0", path = "crates/nzbd-engine" }
nzbd-feed = { version = "=0.2.0", path = "crates/nzbd-feed" }
nzbd-post = { version = "=0.2.0", path = "crates/nzbd-post" }
nzbd-state = { version = "=0.2.0", path = "crates/nzbd-state" }
nzbd-config = { version = "=0.2.0", path = "crates/nzbd-config" }
nzbd-api = { version = "=0.2.0", path = "crates/nzbd-api" }
nzbd-compat = { version = "=0.2.0", path = "crates/nzbd-compat" }

nzbd-nserv = { version = "=0.2.0", path = "crates/nzbd-nserv" }
nzbd-cluster = { version = "=0.2.0", path = "crates/nzbd-cluster" }
nzbd-torrent = { version = "=0.2.0", path = "crates/nzbd-torrent" }
nzbd-qbit-compat = { version = "=0.2.0", path = "crates/nzbd-qbit-compat" }

flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Keep the workspace MSRV truthful on every target. Tokio 1.53.0's Windows
# signal path uses OnceLock::wait, which is still unstable on Rust 1.85.
tokio = { version = "=1.52.4", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-platform-verifier = "0.6"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tempfile = "3"
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio", "server", "server-auto", "service"] }
http-body-util = "0.1"
httpdate = "1"
rcgen = { version = "0.13", default-features = false, features = ["pem", "aws_lc_rs"] }
sha2 = "0.10"
quick-xml = "0.41"
crc32fast = "1"
base64 = "0.22"
libc = "0.2"
md-5 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
hiqlite = { version = "=0.14.0", default-features = false, features = ["auto-heal", "macros", "sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
toml = "1"
bytes = "1"
anyhow = "1"
mdns-sd = "0.20.3"
icu_normalizer = { version = "=2.1.1", default-features = false, features = ["compiled_data"] }
icu_casemap = { version = "=2.1.1", default-features = false, features = ["compiled_data"] }
librqbit = { version = "=8.1.1", path = "contrib/rqbit/vendor/crates/librqbit", default-features = false, features = ["rust-tls"] }
url = "2"

[patch.crates-io]
# Pinned from plurx 8663d6c0. Keep the transport flush, terminal writer,
# bounded snapshot recovery, and WAL repair changes together.
hiqlite = { path = "vendor/hiqlite" }
hiqlite-wal = { path = "vendor/hiqlite-wal" }

[profile.release]
lto = "thin"
codegen-units = 1
