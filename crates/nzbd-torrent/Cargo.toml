[package]
name = "nzbd-torrent"
description = "BitTorrent engine adapter for nzbd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
fuzzing = []
test-support = ["librqbit/test-support"]

[[example]]
name = "m0_metainfo_pressure_memory"
path = "examples/m0_metainfo_pressure_memory.rs"
required-features = ["fuzzing"]

[dependencies]
bytes = { workspace = true }
httpdate = { workspace = true }
icu_normalizer = { workspace = true }
icu_casemap = { workspace = true }
librqbit = { workspace = true }
percent-encoding = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
librqbit = { workspace = true, features = ["test-support"] }
rcgen = { workspace = true }
sha1 = "0.10"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { workspace = true }
